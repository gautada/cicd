---
name: ci-podman-publish

on:
  workflow_call:
    inputs:
      architectures: {description: JSON array of architectures, type: string, required: true}
      tag_dev: {description: Destination manifest tag, type: string, default: dev}
      tag_build: {description: Intermediate tag prefix, type: string, default: build}
      registry_name: {description: Registry hostname, type: string, default: docker.io}
      environment_name:
        description: GitHub Environment containing registry secrets
        type: string
        default: container-registry
    secrets:
      REGISTRY_USERNAME: {required: false}
      REGISTRY_TOKEN: {required: false}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Preflight and locate tools
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${REGISTRY_USERNAME}" ]] || missing+=(REGISTRY_USERNAME)
          [[ -n "${REGISTRY_TOKEN}" ]] || missing+=(REGISTRY_TOKEN)
          if ((${#missing[@]})); then
            echo "::error::Missing GitHub Environment secrets: ${missing[*]}."
            echo "::error::Configure environment '${{ inputs.environment_name }}'."
            exit 2
          fi
          jq -e \
            'type == "array" and length > 0 and all(.[]; . == "amd64" or . == "arm64")' \
            <<< "${ARCHITECTURES}" >/dev/null || {
            echo "::error::architectures must be a non-empty JSON array containing amd64 and/or arm64"
            exit 2
          }
          podman_path="$(command -v podman)" || { echo "::error::podman was not found on PATH"; exit 1; }
          echo "PODMAN=${podman_path}" >> "${GITHUB_ENV}"
          "${podman_path}" --version
      - name: Log in to registry
        env:
          REGISTRY: ${{ inputs.registry_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" | "${PODMAN}" login "${REGISTRY}" \
            --username "${REGISTRY_USERNAME}" --password-stdin
      - name: Assemble and publish manifest
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          REGISTRY: ${{ inputs.registry_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TAG_BUILD: ${{ inputs.tag_build }}
          DESTINATION_TAG: ${{ inputs.tag_dev }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          repo="${GITHUB_REPOSITORY#*/}"
          container="${REGISTRY}/${REGISTRY_USERNAME}/${repo}"
          manifest="${container}:${DESTINATION_TAG}"
          "${PODMAN}" manifest rm "${manifest}" 2>/dev/null || true
          "${PODMAN}" manifest create "${manifest}"
          while IFS= read -r architecture; do
            source="${container}:${TAG_BUILD}-${architecture}-${sha}"
            "${PODMAN}" pull "${source}"
            "${PODMAN}" manifest add "${manifest}" "${source}"
          done < <(jq -r '.[]' <<< "${ARCHITECTURES}")
          "${PODMAN}" manifest push --all "${manifest}" "docker://${manifest}"
          echo "Published ${manifest}" >> "${GITHUB_STEP_SUMMARY}"
