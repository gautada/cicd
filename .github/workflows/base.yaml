---
name: Base CI/CD harness

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: base-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pr:
    name: Check for an open PR on this branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip push runs once a PR is already open for this branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "${EVENT_NAME}" == push && "${REF_NAME}" != dev && "${REF_NAME}" != main ]]; then
            existing="$(gh pr list --head "${REF_NAME}" --state open \
              --json number --jq '.[0].number // empty')"
            if [[ -n "${existing}" ]]; then
              echo "PR #${existing} is already open for ${REF_NAME}; skipping the push-triggered run."
              skip=true
            fi
          fi
          echo "skip=${skip}" >> "${GITHUB_OUTPUT}"

  base:
    needs: check-pr
    if: needs.check-pr.outputs.skip != 'true'
    uses: ./.github/workflows/cicd-base.yaml
    with:
      cicd_ref: dev

  promote:
    name: Open or update dev to main PR
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
      - name: Build accumulated feature PR list
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main dev --quiet
          numbers="$(git log origin/main..origin/dev --merges \
            --grep='Merge pull request #' --format='%s' \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -un || true)"
          {
            echo "body<<PROMOTE_BODY_EOF"
            echo "Automated promotion after cicd's own lint and deep-scan passed."
            echo
            if [[ -n "${numbers}" ]]; then
              echo "## Feature PRs included in this release"
              echo
              while IFS= read -r number; do
                [[ -n "${number}" ]] || continue
                title="$(gh pr view "${number}" --json title --jq '.title' 2>/dev/null || echo "")"
                if [[ -n "${title}" ]]; then
                  echo "- #${number} - ${title}"
                else
                  echo "- #${number}"
                fi
              done <<< "${numbers}"
            else
              echo "_No merged feature PRs found between main and dev._"
            fi
            echo "PROMOTE_BODY_EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Create or update promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head dev --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            gh pr edit "${existing}" --body "${BODY}"
            echo "Updated promotion PR #${existing} with the latest feature PR list."
          else
            gh pr create --base main --head dev \
              --title "Promote dev to main" \
              --body "${BODY}"
          fi
