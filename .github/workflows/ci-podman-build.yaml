---
name: Build Container Image

on:
  workflow_call:
    inputs:
      architecture:
        description: CPU architecture (amd64 or arm64)
        type: string
        required: true
      args_file:
        description: Path to the build-argument file
        type: string
        default: .args
      containerfile:
        description: Path to the Containerfile
        type: string
        default: Containerfile
      registry_name:
        description: Registry hostname
        type: string
        default: docker.io
      tag_build:
        description: Prefix for intermediate images
        type: string
        default: build
      environment_name:
        description: GitHub Environment containing registry secrets
        type: string
        default: container-registry
      publish:
        description: Push the intermediate image to the registry
        type: boolean
        default: false
      test_command:
        description: Built-in command run inside the built image
        type: string
        default: /usr/bin/container-test
      test_timeout:
        description: Seconds allowed for built-in tests
        type: number
        default: 60
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  local:
    name: Container Build ${{ inputs.architecture }}
    if: inputs.publish == false
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Validate inputs
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          ARGS_FILE: ${{ inputs.args_file }}
          CONTAINERFILE: ${{ inputs.containerfile }}
        run: |
          set -euo pipefail
          [[ "${ARCHITECTURE}" == amd64 || "${ARCHITECTURE}" == arm64 ]] || {
            echo "::error::architecture must be amd64 or arm64"
            exit 2
          }
          [[ -f "${CONTAINERFILE}" ]] || { echo "::error::Missing ${CONTAINERFILE}"; exit 2; }
      - name: Install Podman
        uses: gautada/cicd/.github/actions/install-podman@main  # nosemgrep
      - name: Build image
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          ARGS_FILE: ${{ inputs.args_file }}
          CONTAINERFILE: ${{ inputs.containerfile }}
        run: |
          set -euo pipefail
          args="$(mktemp)"
          trap 'rm -f "${args}"' EXIT
          if [[ -f "${ARGS_FILE}" ]]; then grep -v '^GIT_COMMIT=' "${ARGS_FILE}" > "${args}" || true; fi
          printf 'GIT_COMMIT=%s\n' "$(git rev-parse --short HEAD)" >> "${args}"
          "${PODMAN}" build --arch "${ARCHITECTURE}" --layers \
            --ulimit nofile=65536:65536 --build-arg-file "${args}" \
            --file "${CONTAINERFILE}" --tag "local/test:${ARCHITECTURE}" .
          echo "LOCAL_IMAGE=local/test:${ARCHITECTURE}" >> "${GITHUB_ENV}"
      - name: Test built image
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          TEST_COMMAND: ${{ inputs.test_command }}
          TEST_TIMEOUT: ${{ inputs.test_timeout }}
        run: |
          set -euo pipefail
          name="build-test-${GITHUB_RUN_ID}-${ARCHITECTURE}"
          "${PODMAN}" run --detach --name "${name}" "${LOCAL_IMAGE}"
          status=1
          deadline=$((SECONDS + TEST_TIMEOUT))
          while true; do
            if "${PODMAN}" exec "${name}" "${TEST_COMMAND}"; then
              status=0
              break
            fi
            ((SECONDS < deadline)) || break
            [[ "$("${PODMAN}" inspect --format '{{.State.Running}}' "${name}")" == true ]] || break
            sleep 5
          done
          if ((status != 0)); then "${PODMAN}" logs "${name}" || true; fi
          "${PODMAN}" rm --force "${name}" || true
          exit "${status}"

  publish:
    name: Container Build & Publish ${{ inputs.architecture }}
    if: inputs.publish == true
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Preflight configuration
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          CONTAINERFILE: ${{ inputs.containerfile }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${REGISTRY_USERNAME}" ]] || missing+=(REGISTRY_USERNAME)
          [[ -n "${REGISTRY_TOKEN}" ]] || missing+=(REGISTRY_TOKEN)
          if ((${#missing[@]})); then
            echo "::error::Missing GitHub Environment secrets: ${missing[*]}."
            echo "::error::Configure environment '${ENVIRONMENT_NAME}'."
            exit 2
          fi
          [[ "${ARCHITECTURE}" == amd64 || "${ARCHITECTURE}" == arm64 ]] || {
            echo "::error::Invalid architecture"
            exit 2
          }
          [[ -f "${CONTAINERFILE}" ]] || {
            echo "::error::Missing ${CONTAINERFILE}"
            exit 2
          }
      - name: Install Podman
        uses: gautada/cicd/.github/actions/install-podman@main  # nosemgrep
      - name: Log in to registry
        env:
          REGISTRY: ${{ inputs.registry_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | "${PODMAN}" login "${REGISTRY}" \
            --username "${REGISTRY_USERNAME}" --password-stdin
      - name: Build image
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          ARGS_FILE: ${{ inputs.args_file }}
          CONTAINERFILE: ${{ inputs.containerfile }}
          REGISTRY: ${{ inputs.registry_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          TAG_BUILD: ${{ inputs.tag_build }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          repo="${GITHUB_REPOSITORY#*/}"
          image="${REGISTRY}/${REGISTRY_USERNAME}/${repo}:${TAG_BUILD}-${ARCHITECTURE}-${sha}"
          args="$(mktemp)"
          trap 'rm -f "${args}"' EXIT
          if [[ -f "${ARGS_FILE}" ]]; then grep -v '^GIT_COMMIT=' "${ARGS_FILE}" > "${args}" || true; fi
          printf 'GIT_COMMIT=%s\n' "${sha}" >> "${args}"
          "${PODMAN}" build --arch "${ARCHITECTURE}" --layers \
            --ulimit nofile=65536:65536 --build-arg-file "${args}" \
            --file "${CONTAINERFILE}" --tag "${image}" .
          echo "LOCAL_IMAGE=${image}" >> "${GITHUB_ENV}"
      - name: Test built image
        env:
          ARCHITECTURE: ${{ inputs.architecture }}
          TEST_COMMAND: ${{ inputs.test_command }}
          TEST_TIMEOUT: ${{ inputs.test_timeout }}
        run: |
          set -euo pipefail
          name="build-test-${GITHUB_RUN_ID}-${ARCHITECTURE}"
          "${PODMAN}" run --detach --name "${name}" "${LOCAL_IMAGE}"
          status=1
          deadline=$((SECONDS + TEST_TIMEOUT))
          while true; do
            if "${PODMAN}" exec "${name}" "${TEST_COMMAND}"; then
              status=0
              break
            fi
            ((SECONDS < deadline)) || break
            [[ "$("${PODMAN}" inspect --format '{{.State.Running}}' "${name}")" == true ]] || break
            sleep 5
          done
          if ((status != 0)); then "${PODMAN}" logs "${name}" || true; fi
          "${PODMAN}" rm --force "${name}" || true
          exit "${status}"
      - name: Push tested image
        run: |
          set -euo pipefail
          "${PODMAN}" push "${LOCAL_IMAGE}"
          echo "Built, tested, and pushed ${LOCAL_IMAGE}" >> "${GITHUB_STEP_SUMMARY}"
