---
name: Test Published Container

on:
  workflow_call:
    inputs:
      registry_name: {description: Registry hostname, type: string, default: docker.io}
      environment_name:
        description: GitHub Environment containing registry secrets
        type: string
        default: container-registry
      image_tag: {description: Published image tag to test, type: string, default: dev}
      startup_timeout: {description: Seconds allowed for container startup, type: number, default: 60}
    secrets:
      REGISTRY_USERNAME: {required: false}
      REGISTRY_TOKEN: {required: false}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Preflight
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${REGISTRY_USERNAME}" ]] || missing+=(REGISTRY_USERNAME)
          [[ -n "${REGISTRY_TOKEN}" ]] || missing+=(REGISTRY_TOKEN)
          if ((${#missing[@]})); then
            echo "::error::Missing GitHub Environment secrets: ${missing[*]}."
            echo "::error::Configure environment '${ENVIRONMENT_NAME}'."
            exit 2
          fi
      - name: Install Podman
        uses: gautada/cicd/.github/actions/install-podman@main  # nosemgrep
      - name: Log in and pull image
        env:
          REGISTRY: ${{ inputs.registry_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | "${PODMAN}" login "${REGISTRY}" \
            --username "${REGISTRY_USERNAME}" --password-stdin
          image="${REGISTRY}/${REGISTRY_USERNAME}/${GITHUB_REPOSITORY#*/}:${IMAGE_TAG}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          "${PODMAN}" pull "${image}"
      - name: Run built-in container tests
        env:
          STARTUP_TIMEOUT: ${{ inputs.startup_timeout }}
        run: |
          set -euo pipefail
          name="cicd-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          env_file="$(mktemp)"
          echo "CONTAINER_NAME=${name}" >> "${GITHUB_ENV}"
          trap 'rm -f "${env_file}"' EXIT
          "${PODMAN}" run --env-file "${env_file}" --detach --name "${name}" "${IMAGE}"
          deadline=$((SECONDS + STARTUP_TIMEOUT))
          until "${PODMAN}" exec "${name}" /usr/bin/container-test; do
            if ((SECONDS >= deadline)); then
              echo "::error::Container tests did not pass within ${STARTUP_TIMEOUT}s"
              exit 1
            fi
            if [[ "$("${PODMAN}" inspect --format '{{.State.Running}}' "${name}")" != true ]]; then
              echo "::error::Container exited before its tests passed"
              exit 1
            fi
            sleep 5
          done
      - name: Capture logs on failure
        if: failure() && env.CONTAINER_NAME != ''
        run: |
          "${PODMAN}" logs "${CONTAINER_NAME}" || true
      - name: Clean up container
        if: always() && env.CONTAINER_NAME != ''
        run: |
          "${PODMAN}" rm --force "${CONTAINER_NAME}" || true
