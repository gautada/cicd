---
name: Container CI/CD Pipeline

on:
  workflow_call:
    inputs:
      architectures:
        description: JSON array of CPU architectures
        type: string
        default: '["amd64", "arm64"]'
      environment_name:
        description: Protected GitHub Environment for registry operations
        type: string
        default: container-registry
      registry_name:
        description: Registry hostname
        type: string
        default: docker.io
      promote:
        description: Open a dev to main promotion PR after testing
        type: boolean
        default: true
      enforce_immutable_tags:
        description: Refuse to overwrite an existing version tag with different content
        type: boolean
        default: false
    secrets:
      DOCKERIO_REGISTRY:
        required: false
      DOCKERIO_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  build-pr:
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architectures) }}
    uses: ./.github/workflows/ci-podman-build.yaml
    with:
      architecture: ${{ matrix.architecture }}
      publish: false

  build:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architectures) }}
    uses: ./.github/workflows/ci-podman-build.yaml
    with:
      architecture: ${{ matrix.architecture }}
      environment_name: ${{ inputs.environment_name }}
      publish: true
      registry_name: ${{ inputs.registry_name }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.DOCKERIO_REGISTRY }}
      REGISTRY_TOKEN: ${{ secrets.DOCKERIO_TOKEN }}

  publish-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build
    uses: ./.github/workflows/ci-podman-publish.yaml
    with:
      architectures: ${{ inputs.architectures }}
      environment_name: ${{ inputs.environment_name }}
      registry_name: ${{ inputs.registry_name }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.DOCKERIO_REGISTRY }}
      REGISTRY_TOKEN: ${{ secrets.DOCKERIO_TOKEN }}

  test-dev:
    needs: publish-dev
    uses: ./.github/workflows/ci-container-test.yaml
    with:
      environment_name: ${{ inputs.environment_name }}
      registry_name: ${{ inputs.registry_name }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.DOCKERIO_REGISTRY }}
      REGISTRY_TOKEN: ${{ secrets.DOCKERIO_TOKEN }}

  promote:
    name: Open or update dev to main PR
    if: inputs.promote && github.ref == 'refs/heads/dev'
    needs: test-dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/promote-dev-to-main
        with:
          intro: Automated promotion after the dev image passed CI and container tests.

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/ci-podman-publish.yaml
    with:
      architectures: ${{ inputs.architectures }}
      environment_name: ${{ inputs.environment_name }}
      registry_name: ${{ inputs.registry_name }}
      tag_dev: candidate
    secrets:
      REGISTRY_USERNAME: ${{ secrets.DOCKERIO_REGISTRY }}
      REGISTRY_TOKEN: ${{ secrets.DOCKERIO_TOKEN }}

  test-release:
    needs: publish-release
    uses: ./.github/workflows/ci-container-test.yaml
    with:
      environment_name: ${{ inputs.environment_name }}
      image_tag: candidate
      registry_name: ${{ inputs.registry_name }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.DOCKERIO_REGISTRY }}
      REGISTRY_TOKEN: ${{ secrets.DOCKERIO_TOKEN }}

  release:
    needs: test-release
    uses: ./.github/workflows/cd-tag-latest.yaml
    with:
      architectures: ${{ inputs.architectures }}
      environment_name: ${{ inputs.environment_name }}
      registry_name: ${{ inputs.registry_name }}
      enforce_immutable_tags: ${{ inputs.enforce_immutable_tags }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.DOCKERIO_REGISTRY }}
      REGISTRY_TOKEN: ${{ secrets.DOCKERIO_TOKEN }}

  github-release:
    name: Cut a GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
      - name: Determine version and release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          tag="release-${sha:0:7}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          merged_pr="$(gh pr list --base main --state merged \
            --search "head:dev" --json number,body,mergeCommit \
            --jq "[.[] | select(.mergeCommit.oid == \"${sha}\")][0]")"
          body="$(jq -r '.body // empty' <<< "${merged_pr}")"
          {
            echo "body<<RELEASE_BODY_EOF"
            if [[ -n "${body}" ]]; then
              echo "${body}"
            else
              echo "Automated release from ${sha}."
            fi
            echo "RELEASE_BODY_EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.notes.outputs.tag }}
          BODY: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping."
            exit 0
          fi
          gh release create "${TAG}" \
            --target main \
            --title "${TAG}" \
            --notes "${BODY}"
