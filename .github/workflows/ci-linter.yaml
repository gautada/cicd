---
name: ci-linter

on:
  workflow_call:
    inputs:
      cicd_ref:
        description: cicd revision containing lint configuration
        type: string
        default: main

permissions:
  contents: read

jobs:
  lint:
    name: Super Linter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out trusted CI/CD tooling
        uses: actions/checkout@v5
        with:
          repository: gautada/cicd
          ref: ${{ inputs.cicd_ref }}
          path: .cicd-tooling
          persist-credentials: false
      - name: Pull ephemeral linter configuration
        env:
          CICD_REF: ${{ inputs.cicd_ref }}
        run: bash .cicd-tooling/bin/pre-commit --pull-only --ref "${CICD_REF}"
      - name: Remove tooling checkout from lint scope
        run: rm -rf .cicd-tooling
      - name: Run Super Linter
        uses: super-linter/super-linter@v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_STATUS_API: false
          OUTPUT_DETAILS: detailed
          LINTER_RULES_PATH: .
          FILTER_REGEX_EXCLUDE: '.*\.zsh$'
          DOCKERFILE_HADOLINT_FILE_NAME: .hadolint.yaml
          VALIDATE_BASH_EXEC: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_CHECKOV: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_PYTHON: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          VALIDATE_SHELL_SHFMT: false
          VALIDATE_SPELL_CODESPELL: false
          VALIDATE_TRIVY: false
          VALIDATE_YAML_PRETTIER: false
