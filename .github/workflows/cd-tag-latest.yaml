---
name: Release Container Image

on:
  workflow_call:
    inputs:
      architectures: {description: JSON array of architectures, type: string, required: true}
      registry_name: {description: Registry hostname, type: string, default: docker.io}
      tag_build: {description: Intermediate tag prefix, type: string, default: build}
      environment_name: {description: Protected GitHub Environment, type: string, default: container-registry}
      enforce_immutable_tags: {description: "Refuse to overwrite an existing version tag with different content", type: boolean, default: true} # yamllint disable-line rule:line-length
    secrets:
      REGISTRY_USERNAME: {required: false}
      REGISTRY_TOKEN: {required: false}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Preflight and locate Podman
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${REGISTRY_USERNAME}" ]] || missing+=(REGISTRY_USERNAME)
          [[ -n "${REGISTRY_TOKEN}" ]] || missing+=(REGISTRY_TOKEN)
          if ((${#missing[@]})); then
            echo "::error::Missing GitHub Environment secrets: ${missing[*]}."
            echo "::error::Configure environment '${ENVIRONMENT_NAME}'."
            exit 2
          fi
          jq -e 'type == "array" and length > 0' <<< "${ARCHITECTURES}" >/dev/null
          sudo apt-get update
          sudo apt-get install --yes podman crun conmon
          path_podman="$(command -v podman)" || { echo "::error::podman was not found on PATH"; exit 1; }
          podman_path="$(dpkg-query --listfiles podman | awk '/\/bin\/podman$/ {print; exit}')"
          [[ -x "${podman_path}" ]] || { echo "::error::the installed podman package has no executable"; exit 1; }
          skopeo_path="$(command -v skopeo)" || { echo "::error::skopeo was not found on PATH"; exit 1; }
          echo "PODMAN=${podman_path}" >> "${GITHUB_ENV}"
          echo "SKOPEO=${skopeo_path}" >> "${GITHUB_ENV}"
          echo "Podman on PATH: ${path_podman}"
          echo "Podman from installed package: ${podman_path}"
          "${podman_path}" --version
          crun --version
          conmon --version
          "${skopeo_path}" --version
      - name: Publish immutable version and latest
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          REGISTRY: ${{ inputs.registry_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          TAG_BUILD: ${{ inputs.tag_build }}
          ENFORCE_IMMUTABLE_TAGS: ${{ inputs.enforce_immutable_tags }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_TOKEN}" | "${PODMAN}" login "${REGISTRY}" \
            --username "${REGISTRY_USERNAME}" --password-stdin
          container="${REGISTRY}/${REGISTRY_USERNAME}/${GITHUB_REPOSITORY#*/}"
          sha="$(git rev-parse --short HEAD)"
          first_arch="$(jq -r '.[0]' <<< "${ARCHITECTURES}")"
          first_image="${container}:${TAG_BUILD}-${first_arch}-${sha}"
          "${PODMAN}" pull "${first_image}"
          version="$("${PODMAN}" run --rm --entrypoint /usr/bin/container-version "${first_image}" | tr -d '[:space:]')"
          [[ "${version}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "::error::container-version returned an empty or invalid registry tag: '${version}'"
            exit 2
          }
          latest="${container}:latest"
          "${PODMAN}" manifest rm "${latest}" 2>/dev/null || true
          "${PODMAN}" manifest create "${latest}"
          while IFS= read -r architecture; do
            image="${container}:${TAG_BUILD}-${architecture}-${sha}"
            "${PODMAN}" pull "${image}"
            "${PODMAN}" manifest add "${latest}" "${image}"
          done < <(jq -r '.[]' <<< "${ARCHITECTURES}")
          versioned="${container}:${version}"
          candidate_digest="$("${SKOPEO}" inspect --format '{{.Digest}}' \
            "docker://${container}:candidate")"
          if [[ "${ENFORCE_IMMUTABLE_TAGS}" == "true" ]]; then
            if version_digest="$("${SKOPEO}" inspect --format '{{.Digest}}' \
              "docker://${versioned}" 2>/dev/null)"; then
              [[ "${version_digest}" == "${candidate_digest}" ]] || {
                echo "::error::Refusing to overwrite immutable tag ${versioned}"
                exit 1
              }
              echo "${versioned} already identifies this manifest; keeping it."
            else
              "${PODMAN}" manifest push --all "${latest}" "docker://${versioned}"
            fi
          else
            echo "enforce_immutable_tags is false; pushing ${versioned} unconditionally."
            "${PODMAN}" manifest push --all "${latest}" "docker://${versioned}"
          fi
          "${PODMAN}" manifest push --all "${latest}" "docker://${latest}"
          printf 'Published %s and %s\n' "${latest}" "${versioned}" >> "${GITHUB_STEP_SUMMARY}"
