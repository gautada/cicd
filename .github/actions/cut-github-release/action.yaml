name: Cut a GitHub Release
description: >-
  Create (or skip, if it already exists) a GitHub Release on the current
  commit, with notes pulled from the merged dev-to-main PR whose merge
  commit matches this SHA.
inputs:
  tag:
    description: >-
      Tag name for the release. Supports strftime-style tokens via the
      date command: use literal text plus $(date -u +'...') if you need a
      computed tag, or pass a fully-resolved tag directly.
    required: true
outputs:
  tag:
    description: The tag that was created (or already existed)
    value: ${{ inputs.tag }}
runs:
  using: composite
  steps:
    - name: Determine release notes
      id: notes
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        sha="${GITHUB_SHA}"
        merged_pr="$(gh pr list --base main --state merged \
          --search "head:dev" --json number,body,mergeCommit \
          --jq "[.[] | select(.mergeCommit.oid == \"${sha}\")][0]")"
        body="$(jq -r '.body // empty' <<< "${merged_pr}")"
        {
          echo "body<<RELEASE_BODY_EOF"
          if [[ -n "${body}" ]]; then
            echo "${body}"
          else
            echo "Automated release from ${sha}."
          fi
          echo "RELEASE_BODY_EOF"
        } >> "${GITHUB_OUTPUT}"
    - name: Create GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
        BODY: ${{ steps.notes.outputs.body }}
      run: |
        set -euo pipefail
        if gh release view "${TAG}" >/dev/null 2>&1; then
          echo "Release ${TAG} already exists; skipping."
          exit 0
        fi
        gh release create "${TAG}" \
          --target main \
          --title "${TAG}" \
          --notes "${BODY}"
