---
name: Validate consumer repo setup
description: >-
  Check that a consumer repository is fully up to date with the
  canonical cicd template.  Fetches the template from gautada/cicd
  and diffs it against the consumer's actual workflow.  Any drift
  fails the build with a clear diff showing what needs to change.
inputs:
  cicd_ref:
    description: >-
      Revision of gautada/cicd to compare against (default: main).
    required: false
    default: main
  require_container_test:
    description: >-
      Require /usr/bin/container-test in the Containerfile.
    required: false
    default: "true"
  require_container_version:
    description: >-
      Require /usr/bin/container-version in the Containerfile.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Fetch canonical cicd template
      shell: bash
      env:
        CICD_REF: ${{ inputs.cicd_ref }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/cicd-template
        curl -sSfL \
          "https://raw.githubusercontent.com/gautada/cicd/${CICD_REF}/templates/workflows/container.yaml" \
          -o /tmp/cicd-template/container.yaml
        echo "✓ Fetched canonical container.yaml from gautada/cicd@${CICD_REF}"

    - name: Validate consumer CI/CD wiring
      shell: bash
      env:
        REQUIRE_CONTAINER_TEST: ${{ inputs.require_container_test }}
        REQUIRE_CONTAINER_VERSION: ${{ inputs.require_container_version }}
      run: |
        set -euo pipefail
        errors=0

        echo "::group::Consumer CI/CD validation"

        # --- container.yaml must match the canonical template ---
        if [[ ! -f .github/workflows/container.yaml ]]; then
          msg="Missing .github/workflows/container.yaml"
          msg="${msg} — copy from gautada/cicd template"
          msg="${msg} or run the installer with"
          msg="${msg} --workflow container --sync-project"
          echo "::error::${msg}"
          errors=$((errors + 1))
        else
          diff_out=/tmp/cicd-template/container.diff
          if diff -u /tmp/cicd-template/container.yaml \
            .github/workflows/container.yaml \
            > "${diff_out}" 2>&1; then
            echo "✓ .github/workflows/container.yaml matches canonical template"
          else
            msg="container.yaml is out of date with the"
            msg="${msg} canonical cicd template. Run the"
            msg="${msg} installer with --workflow container"
            msg="${msg} --sync-project or manually apply"
            msg="${msg} the diff below."
            wf=".github/workflows/container.yaml"
            echo "::error file=${wf}::${msg}"
            echo ""
            echo "--- Expected (gautada/cicd template) vs Actual (this repo) ---"
            cat /tmp/cicd-template/container.diff
            echo ""
            errors=$((errors + 1))
          fi
        fi

        # --- Containerfile checks ---
        if [[ -f Containerfile ]]; then
          echo "✓ Containerfile exists"

          if [[ "${REQUIRE_CONTAINER_TEST}" == "true" ]]; then
            if grep -q '/usr/bin/container-test' Containerfile; then
              echo "✓ Containerfile references /usr/bin/container-test"
            else
              echo "::error file=Containerfile::Missing /usr/bin/container-test — required for CI container testing"
              errors=$((errors + 1))
            fi
          fi

          if [[ "${REQUIRE_CONTAINER_VERSION}" == "true" ]]; then
            if grep -q '/usr/bin/container-version' Containerfile; then
              echo "✓ Containerfile references /usr/bin/container-version"
            else
              echo "::error file=Containerfile::Missing /usr/bin/container-version — required for release tagging"
              errors=$((errors + 1))
            fi
          fi
        else
          echo "::warning::No Containerfile found — skipping container-specific checks"
        fi

        # --- AGENTS.md ---
        if [[ -f AGENTS.md ]]; then
          echo "✓ AGENTS.md exists"
        else
          echo "::warning::Missing AGENTS.md — copy CONTAINER-Agents.md from gautada/cicd for agent instructions"
        fi

        echo "::endgroup::"

        if [[ "${errors}" -gt 0 ]]; then
          echo ""
          echo "::error::Consumer validation failed with ${errors} error(s). See annotations and diff output above."
          echo ""
          echo "To fix: run from your repo root:"
          url="https://raw.githubusercontent.com"
          url="${url}/gautada/cicd/main/bin/pre-commit"
          echo "  curl -sSfL ${url}" \
            "| bash -s -- --workflow container" \
            "--sync-project"
          exit 1
        fi

        echo ""
        echo "Consumer CI/CD validation: PASS"
