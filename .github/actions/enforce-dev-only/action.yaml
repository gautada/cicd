name: Enforce dev-only promotions to main
description: >-
  Fail a pull_request run when its base branch is main but its head branch
  is not dev, so accidental or intentional direct-to-main PRs are rejected
  before they can merge.
runs:
  using: composite
  steps:
    - name: Reject any PR into main that isn't from dev
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      shell: bash
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: |
        if [[ "${HEAD_REF}" != "dev" ]]; then
          echo "::error::Direct PRs into main are not allowed - merge into dev first, then promote dev to main."
          exit 1
        fi
