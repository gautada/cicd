name: Install Podman
description: >-
  Install podman via apt, working around GitHub-hosted runners'
  intermittently unreachable regional apt mirror (azure.archive.ubuntu.com)
  by forcing the upstream mirror and tuning apt's retry/timeout behavior.
inputs:
  packages:
    description: Space-separated apt package list to install (in addition to podman)
    required: false
    default: ""
outputs:
  podman-path:
    description: Absolute path to the installed podman executable
    value: ${{ steps.locate.outputs.podman-path }}
runs:
  using: composite
  steps:
    - name: Configure resilient apt mirrors
      shell: bash
      run: |
        set -euo pipefail
        # GitHub-hosted ubuntu-latest runners default to a regional Azure
        # mirror that intermittently stalls or is entirely unreachable.
        # Replace it with the upstream archive, and also handle the DEB822
        # .sources format used by Ubuntu 24.04+ runners.
        #
        # Legacy format (sources.list / apt-mirrors.txt)
        sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
          /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
        # DEB822 format (.sources files) and legacy .list fragments
        sudo find /etc/apt/sources.list.d \
          \( -name '*.sources' -o -name '*.list' \) 2>/dev/null \
          | xargs -r sudo sed -i \
              's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g'
    - name: Install podman
      id: install
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)

        # --- apt-get update with mirror fallback ---
        # Try archive.ubuntu.com first (set above). If it is also
        # unreachable (exit 124 = timeout, 100 = apt error), swap to
        # the Canonical country-neutral mirror and retry once.
        if ! sudo timeout 120 apt-get "${apt_opts[@]}" update 2>&1; then
          echo "::warning::Primary mirror failed; falling back to us.archive.ubuntu.com"
          sudo sed -i 's|archive\.ubuntu\.com|us.archive.ubuntu.com|g' \
            /etc/apt/sources.list 2>/dev/null || true
          sudo find /etc/apt/sources.list.d \
            \( -name '*.sources' -o -name '*.list' \) 2>/dev/null \
            | xargs -r sudo sed -i \
                's|archive\.ubuntu\.com|us.archive.ubuntu.com|g'
          sudo timeout 120 apt-get "${apt_opts[@]}" update
        fi

        # shellcheck disable=SC2086
        sudo timeout 300 apt-get "${apt_opts[@]}" install --yes podman ${EXTRA_PACKAGES}
    - name: Locate podman
      id: locate
      shell: bash
      run: |
        set -euo pipefail
        podman_path="$(command -v podman)" || {
          echo "::error::podman was not found on PATH"
          exit 1
        }
        echo "PODMAN=${podman_path}" >> "${GITHUB_ENV}"
        echo "podman-path=${podman_path}" >> "${GITHUB_OUTPUT}"
        "${podman_path}" --version
