name: Install Podman
description: >-
  Ensure podman is available. Uses the runner's pre-installed podman when
  present; falls back to apt with resilient mirror handling when it is not.
inputs:
  packages:
    description: Space-separated apt package list to install (in addition to podman)
    required: false
    default: ""
outputs:
  podman-path:
    description: Absolute path to the installed podman executable
    value: ${{ steps.locate.outputs.podman-path }}
runs:
  using: composite
  steps:
    - name: Install podman
      id: install
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail

        # ── helper: swap a mirror hostname across every apt config file ──
        swap_mirror() {
          local old="$1" new="$2"
          sudo sed -i "s|${old}|${new}|g" \
            /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo find /etc/apt/sources.list.d \
            \( -name '*.sources' -o -name '*.list' \) 2>/dev/null \
            | xargs -r sudo sed -i "s|${old}|${new}|g"
        }

        # ── skip apt entirely when podman is already present ──
        if command -v podman &>/dev/null && [[ -z "${EXTRA_PACKAGES}" ]]; then
          echo "podman already installed — skipping apt"
          exit 0
        fi

        # ── fix flaky Azure mirrors ──
        swap_mirror 'azure\.archive\.ubuntu\.com' 'archive.ubuntu.com'

        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)

        # ── apt-get update with fallback mirror chain ──
        if ! sudo timeout 120 apt-get "${apt_opts[@]}" update 2>&1; then
          echo "::warning::Primary mirror failed; falling back to us.archive.ubuntu.com"
          swap_mirror 'archive\.ubuntu\.com' 'us.archive.ubuntu.com'
          sudo timeout 120 apt-get "${apt_opts[@]}" update
        fi

        # shellcheck disable=SC2086
        sudo timeout 300 apt-get "${apt_opts[@]}" install --yes podman ${EXTRA_PACKAGES}
    - name: Locate podman
      id: locate
      shell: bash
      run: |
        set -euo pipefail
        podman_path="$(command -v podman)" || {
          echo "::error::podman was not found on PATH"
          exit 1
        }
        echo "PODMAN=${podman_path}" >> "${GITHUB_ENV}"
        echo "podman-path=${podman_path}" >> "${GITHUB_OUTPUT}"
        "${podman_path}" --version
