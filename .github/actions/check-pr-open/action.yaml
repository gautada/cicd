name: Check for an open PR on this branch
description: >-
  Detect whether a push-triggered run's branch already has an open PR, so the
  caller can skip duplicate work when both push and pull_request will fire
  for the same commit.
outputs:
  skip:
    description: "'true' if a push run should be skipped because a PR is already open"
    value: ${{ steps.check.outputs.skip }}
runs:
  using: composite
  steps:
    - name: Skip push runs once a PR is already open for this branch
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        skip=false
        if [[ "${EVENT_NAME}" == push && "${REF_NAME}" != dev && "${REF_NAME}" != main ]]; then
          existing="$(gh pr list --head "${REF_NAME}" --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            echo "PR #${existing} is already open for ${REF_NAME}; skipping the push-triggered run."
            skip=true
          fi
        fi
        echo "skip=${skip}" >> "${GITHUB_OUTPUT}"
