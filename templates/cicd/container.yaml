---
name: Container CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: gautada/cicd/.github/workflows/ci-linter.yaml@main

  deep-scan:
    needs: lint
    uses: gautada/cicd/.github/workflows/ci-deep-scan.yaml@main

  # Pull requests build locally without registry credentials. This proves that
  # untrusted changes compile while keeping Environment secrets out of PR jobs.
  build-pr:
    if: github.event_name == 'pull_request'
    needs: [lint, deep-scan]
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    uses: gautada/cicd/.github/workflows/ci-podman-build.yaml@main
    with:
      architecture: ${{ matrix.architecture }}
      publish: false

  # Pushes to protected branches may use the named GitHub Environment. Store
  # REGISTRY_USERNAME and REGISTRY_TOKEN in that Environment.
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint, deep-scan]
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    uses: gautada/cicd/.github/workflows/ci-podman-build.yaml@main
    with:
      architecture: ${{ matrix.architecture }}
      environment_name: container-registry
      publish: true

  publish-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build
    uses: gautada/cicd/.github/workflows/ci-podman-publish.yaml@main
    with:
      architectures: '["amd64", "arm64"]'
      environment_name: container-registry

  test-dev:
    needs: publish-dev
    uses: gautada/cicd/.github/workflows/ci-container-test.yaml@main
    with:
      environment_name: container-registry

  promote:
    name: Open or update dev to main PR
    if: github.ref == 'refs/heads/dev'
    needs: test-dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create promotion PR when none is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --base main --head dev --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            echo "Promotion PR #${existing} already contains the latest dev commits."
            exit 0
          fi
          gh pr create --base main --head dev \
            --title "Promote dev to main" \
            --body "Automated promotion after the dev image passed CI and container tests."

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: build
    uses: gautada/cicd/.github/workflows/ci-podman-publish.yaml@main
    with:
      architectures: '["amd64", "arm64"]'
      environment_name: container-registry
      tag_dev: candidate

  test-release:
    needs: publish-release
    uses: gautada/cicd/.github/workflows/ci-container-test.yaml@main
    with:
      environment_name: container-registry
      image_tag: candidate

  release:
    needs: test-release
    uses: gautada/cicd/.github/workflows/cd-tag-latest.yaml@main
    with:
      architectures: '["amd64", "arm64"]'
      environment_name: container-registry
